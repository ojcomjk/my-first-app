<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정보 수업 만족도 설문</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, "Malgun Gothic", sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px 15px;
            color: #1e293b;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px #00000012;
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
            font-size: 26px;
        }

        .description {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .question {
            font-weight: bold;
            margin: 25px 0 15px;
        }

        .option {
            display: block;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            cursor: pointer;
        }

        .option:hover {
            background: #eff6ff;
        }

        input[type="radio"] {
            margin-right: 10px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .result-item {
            margin: 15px 0;
        }

        .bar {
            height: 12px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 6px;
        }

        .bar-fill {
            height: 100%;
            background: #3b82f6;
            width: 0;
        }

        .notice {
            color: #64748b;
            font-size: 12px;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>정보 수업 만족도 조사</h1>

        <p class="description">
            여러분의 의견을 수업 개선에 활용합니다.
        </p>

        <form id="surveyForm">
            <p class="question">
                1. 이번 정보 수업에 얼마나 만족하나요?
            </p>

            <label class="option">
                <input type="radio" name="satisfaction"
                       value="매우 만족" required>
                매우 만족
            </label>

            <label class="option">
                <input type="radio" name="satisfaction"
                       value="만족">
                만족
            </label>

            <label class="option">
                <input type="radio" name="satisfaction"
                       value="보통">
                보통
            </label>

            <label class="option">
                <input type="radio" name="satisfaction"
                       value="불만족">
                불만족
            </label>

            <label class="option">
                <input type="radio" name="satisfaction"
                       value="매우 불만족">
                매우 불만족
            </label>

            <p class="question">
                2. 수업에 대한 의견을 입력하세요. (선택)
            </p>

            <textarea id="comment"
                maxlength="500"
                placeholder="좋았던 점이나 개선할 점을 입력하세요."></textarea>

            <button type="submit">설문 제출하기</button>
        </form>

        <p id="message" role="status"></p>

        <section class="result">
            <h2>설문 결과</h2>
            <p id="total">총 응답 수: 0명</p>
            <div id="results"></div>

            <button type="button" id="resetButton">
                테스트 응답 초기화
            </button>

            <p class="notice">
                현재 예제는 이 브라우저에만 응답을 저장합니다.
                여러 학생의 응답을 통합하려면 서버 연결이 필요합니다.
            </p>
        </section>
    </main>

    <script>
        // 1. 설문 선택 항목
        const options = [
            "매우 만족",
            "만족",
            "보통",
            "불만족",
            "매우 불만족"
        ];

        // 2. 브라우저 저장소 이름
        const STORAGE_KEY = "informationSurveyResponses";

        // 3. HTML 요소 가져오기
        const form = document.getElementById("surveyForm");
        const message = document.getElementById("message");
        const results = document.getElementById("results");
        const total = document.getElementById("total");

        // 4. 저장된 응답 불러오기
        function loadResponses() {
            try {
                return JSON.parse(
                    localStorage.getItem(STORAGE_KEY) || "[]"
                );
            } catch {
                return [];
            }
        }

        // 5. 설문 제출 처리
        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const selected = document.querySelector(
                'input[name="satisfaction"]:checked'
            );

            if (!selected) {
                alert("만족도를 선택해 주세요.");
                return;
            }

            const response = {
                answer: selected.value,
                comment: document.getElementById("comment").value.trim(),
                date: new Date().toISOString()
            };

            const responses = loadResponses();
            responses.push(response);

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(responses)
            );

            message.textContent = "응답이 저장되었습니다.";
            message.style.color = "#15803d";

            form.reset();
            showResults();
        });

        // 6. 응답 결과 계산 및 표시
        function showResults() {
            const responses = loadResponses();
            const counts = {};

            options.forEach(function(option) {
                counts[option] = 0;
            });

            responses.forEach(function(response) {
                if (Object.hasOwn(counts, response.answer)) {
                    counts[response.answer]++;
                }
            });

            total.textContent =
                "총 응답 수: " + responses.length + "명";

            results.replaceChildren();

            options.forEach(function(option) {
                const count = counts[option];

                const percent = responses.length > 0
                    ? Math.round(count / responses.length * 100)
                    : 0;

                const item = document.createElement("div");
                item.className = "result-item";

                const label = document.createElement("div");
                label.textContent =
                    `${option}: ${count}명 (${percent}%)`;

                const bar = document.createElement("div");
                bar.className = "bar";

                const fill = document.createElement("div");
                fill.className = "bar-fill";
                fill.style.width = percent + "%";

                bar.appendChild(fill);
                item.append(label, bar);
                results.appendChild(item);
            });
        }

        // 7. 테스트 응답 초기화
        document.getElementById("resetButton")
            .addEventListener("click", function() {
                if (confirm("저장된 테스트 응답을 삭제할까요?")) {
                    localStorage.removeItem(STORAGE_KEY);
                    message.textContent = "";
                    showResults();
                }
            });

        // 8. 페이지를 열 때 결과 표시
        showResults();
    </script>
</body>
</html>
